<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>《Michael的早听晚读》· 成为达人</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: sans-serif; background: #f7f5f0; color: #333; margin: 0; padding: 24px 16px 60px; }
  .container { max-width: 640px; margin: 0 auto; }
  h1 { text-align: center; font-size: 1.5rem; line-height: 1.4; margin: 12px 0 8px; }
  .intro { text-align: center; color: #666; font-size: 0.95rem; line-height: 1.6; margin: 0 0 24px; }
  .card { background: #fff; border-radius: 14px; padding: 20px; margin-bottom: 16px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); }
  .card h2 { font-size: 1.1rem; margin: 0 0 16px; }
  .point { display: flex; gap: 12px; margin-bottom: 16px; }
  .point:last-child { margin-bottom: 0; }
  .num { flex-shrink: 0; width: 28px; height: 28px; line-height: 28px; text-align: center; border-radius: 50%; background: #ff8c42; color: #fff; font-weight: bold; font-size: 0.95rem; }
  .point p { margin: 0; line-height: 1.6; font-size: 0.95rem; }
  .point p b { color: #ff8c42; }
  label { display: block; font-size: 0.95rem; font-weight: bold; margin: 0 0 6px; }
  label .opt { color: #999; font-weight: normal; font-size: 0.85rem; }
  input, textarea { width: 100%; font-size: 1rem; padding: 12px 14px; border: 1px solid #ddd; border-radius: 10px; margin-bottom: 16px; background: #fff; color: #333; }
  input:focus, textarea:focus { outline: none; border-color: #ff8c42; }
  textarea { min-height: 90px; resize: vertical; }
  button { width: 100%; padding: 15px; font-size: 1.1rem; font-weight: bold; color: #fff; background: #ff8c42; border: none; border-radius: 12px; cursor: pointer; }
  button:disabled { opacity: 0.6; cursor: default; }
  #msg { display: none; text-align: center; font-size: 0.95rem; line-height: 1.6; padding: 12px; border-radius: 10px; margin-top: 16px; }
  #msg.success { display: block; color: #0ca678; background: #e6fcf5; }
  #msg.error { display: block; color: #e03131; background: #fff5f5; }
  .foot { text-align: center; color: #999; font-size: 0.85rem; line-height: 1.6; margin-top: 8px; }
</style>
</head>
<body>
<div class="container">
  <h1>《Michael的早听晚读》· 成为达人</h1>
  <p class="intro">每天一期双语节目，有文字和互动功能。<br>把好内容分享给朋友，一起赚点零花钱。</p>

  <div class="card">
    <h2>怎么赚钱</h2>
    <div class="point">
      <span class="num">1</span>
      <p>你拿到专属优惠码，分享给朋友；朋友用你的码 <b>¥79</b> 开通年度会员（原价 ¥98，立减 ¥19）。</p>
    </div>
    <div class="point">
      <span class="num">2</span>
      <p>每成交一单，你赚 <b>¥23.70</b>（提成 30%），成交自动记账，提成按月微信结算。</p>
    </div>
    <div class="point">
      <span class="num">3</span>
      <p>你自己开通只要 <b>¥49</b>（达人自购价）。</p>
    </div>
  </div>

  <div class="card">
    <h2>申请成为达人</h2>
    <form id="applyForm">
      <label for="name">姓名</label>
      <input id="name" name="name" type="text" required autocomplete="name">

      <label for="wechat">微信号</label>
      <input id="wechat" name="wechat" type="text" required autocomplete="off">

      <label for="platformId">小红书号</label>
      <input id="platformId" name="platformId" type="text" required autocomplete="off">

      <label for="followers">小红书粉丝数 <span class="opt">（选填）</span></label>
      <input id="followers" name="followers" type="number" min="0" inputmode="numeric" autocomplete="off">

      <label for="note">备注 <span class="opt">（选填）</span></label>
      <textarea id="note" name="note" placeholder="想说的话"></textarea>

      <button type="submit" id="submitBtn">提交申请</button>
      <div id="msg" role="status"></div>
    </form>
  </div>

  <p class="foot">申请通过后，我们会微信发你专属买家码和自购码。</p>
</div>
<script>
// 申请接口地址：CloudBase HTTP 触发器（affiliate-apply），2026-11-26 已建并实测可用。
var APPLY_URL = 'https://michael-podcast-d0fbngep770f0d12-1535367896.ap-shanghai.app.tcloudbase.com/affiliate-apply';

var form = document.getElementById('applyForm');
var msg = document.getElementById('msg');
var btn = document.getElementById('submitBtn');

function showMsg(text, kind) {
  msg.textContent = text;
  msg.className = kind;
}

form.addEventListener('submit', function (e) {
  e.preventDefault();
  if (APPLY_URL.indexOf('REPLACE-WITH') !== -1) {
    showMsg('申请通道正在开通，请稍后再试', 'error');
    return;
  }
  var followersVal = document.getElementById('followers').value;
  var payload = {
    name: document.getElementById('name').value.trim(),
    wechat: document.getElementById('wechat').value.trim(),
    platform: 'xiaohongshu',
    platformId: document.getElementById('platformId').value.trim(),
    followers: followersVal === '' ? null : Number(followersVal),
    note: document.getElementById('note').value.trim()
  };
  btn.disabled = true;
  btn.textContent = '提交中…';
  fetch(APPLY_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload)
  }).then(function (r) { return r.json(); }).then(function (d) {
    if (d && d.ok) {
      showMsg('已收到申请，我们会微信联系你', 'success');
      form.reset();
    } else {
      showMsg('提交失败，请检查网络后重试', 'error');
    }
  }).catch(function () {
    showMsg('提交失败，请检查网络后重试', 'error');
  }).finally(function () {
    btn.disabled = false;
    btn.textContent = '提交申请';
  });
});
</script>
</body>
</html>
