<script>
const BLOCKS = [{"start": 18.27, "end": 30.63, "en": "Welcome back to Michael's Morning Listening! Today we have two tiny geniuses for you: a bee that learned to play soccer, and an octopus that might be dreaming in color. Let's jump in!", "title": "开场白", "cn": "欢迎回到 Michael 的早听晚读！今天有两个小天才要介绍给你：一只学会了踢足球的蜜蜂，和一只可能会做彩色梦的章鱼。让我们开始吧！", "words": [{"w": "Welcome", "t": 18.27}, {"w": "back", "t": 18.64}, {"w": "to", "t": 19.02}, {"w": "Michael's", "t": 19.39}, {"w": "Morning", "t": 19.77}, {"w": "Listening!", "t": 20.14}, {"w": "Today", "t": 20.52}, {"w": "we", "t": 20.89}, {"w": "have", "t": 21.27}, {"w": "two", "t": 21.64}, {"w": "tiny", "t": 22.02}, {"w": "geniuses", "t": 22.39}, {"w": "for", "t": 22.76}, {"w": "you:", "t": 23.14}, {"w": "a", "t": 23.51}, {"w": "bee", "t": 23.89}, {"w": "that", "t": 24.26}, {"w": "learned", "t": 24.64}, {"w": "to", "t": 25.01}, {"w": "play", "t": 25.39}, {"w": "soccer,", "t": 25.76}, {"w": "and", "t": 26.14}, {"w": "an", "t": 26.51}, {"w": "octopus", "t": 26.88}, {"w": "that", "t": 27.26}, {"w": "might", "t": 27.63}, {"w": "be", "t": 28.01}, {"w": "dreaming", "t": 28.38}, {"w": "in", "t": 28.76}, {"w": "color.", "t": 29.13}, {"w": "Let's", "t": 29.51}, {"w": "jump", "t": 29.88}, {"w": "in!", "t": 30.26}]}, {"start": 41.33, "end": 52.74, "en": "Can you imagine a bee playing soccer? Scientists did more than imagine — they actually trained bumblebees to push a tiny ball into a tiny goal!", "title": "蜜蜂踢足球", "cn": "你能想象蜜蜂踢足球吗？科学家不只停留在想象——他们真的训练大黄蜂把一颗小球推进小球门！", "words": [{"w": "Can", "t": 41.33}, {"w": "you", "t": 41.77}, {"w": "imagine", "t": 42.21}, {"w": "a", "t": 42.65}, {"w": "bee", "t": 43.09}, {"w": "playing", "t": 43.52}, {"w": "soccer?", "t": 43.96}, {"w": "Scientists", "t": 44.4}, {"w": "did", "t": 44.84}, {"w": "more", "t": 45.28}, {"w": "than", "t": 45.72}, {"w": "imagine", "t": 46.16}, {"w": "—", "t": 46.6}, {"w": "they", "t": 47.03}, {"w": "actually", "t": 47.47}, {"w": "trained", "t": 47.91}, {"w": "bumblebees", "t": 48.35}, {"w": "to", "t": 48.79}, {"w": "push", "t": 49.23}, {"w": "a", "t": 49.67}, {"w": "tiny", "t": 50.11}, {"w": "ball", "t": 50.55}, {"w": "into", "t": 50.98}, {"w": "a", "t": 51.42}, {"w": "tiny", "t": 51.86}, {"w": "goal!", "t": 52.3}]}, {"start": 52.74, "end": 70.06, "en": "Here is how it worked. The scientists built a mini soccer field with a little ball and a small goal. When a bee pushed the ball into the goal — GOAL! — it got a sweet drink of sugar water as a prize. Bees love sweet things, so they learned fast.", "title": "蜜蜂踢足球", "cn": "过程是这样的。科学家们搭建了一个迷你足球场，放了一颗小球和一个小球门。当蜜蜂把球推进球门——进球！——它就能喝到一杯甜甜的糖水作为奖励。蜜蜂最爱甜食，所以它们学得飞快。", "words": [{"w": "Here", "t": 52.74}, {"w": "is", "t": 53.08}, {"w": "how", "t": 53.42}, {"w": "it", "t": 53.76}, {"w": "worked.", "t": 54.1}, {"w": "The", "t": 54.44}, {"w": "scientists", "t": 54.78}, {"w": "built", "t": 55.12}, {"w": "a", "t": 55.46}, {"w": "mini", "t": 55.8}, {"w": "soccer", "t": 56.14}, {"w": "field", "t": 56.48}, {"w": "with", "t": 56.82}, {"w": "a", "t": 57.15}, {"w": "little", "t": 57.49}, {"w": "ball", "t": 57.83}, {"w": "and", "t": 58.17}, {"w": "a", "t": 58.51}, {"w": "small", "t": 58.85}, {"w": "goal.", "t": 59.19}, {"w": "When", "t": 59.53}, {"w": "a", "t": 59.87}, {"w": "bee", "t": 60.21}, {"w": "pushed", "t": 60.55}, {"w": "the", "t": 60.89}, {"w": "ball", "t": 61.23}, {"w": "into", "t": 61.57}, {"w": "the", "t": 61.91}, {"w": "goal", "t": 62.25}, {"w": "—", "t": 62.59}, {"w": "GOAL!", "t": 62.93}, {"w": "—", "t": 63.27}, {"w": "it", "t": 63.61}, {"w": "got", "t": 63.95}, {"w": "a", "t": 64.29}, {"w": "sweet", "t": 64.63}, {"w": "drink", "t": 64.97}, {"w": "of", "t": 65.31}, {"w": "sugar", "t": 65.65}, {"w": "water", "t": 65.98}, {"w": "as", "t": 66.32}, {"w": "a", "t": 66.66}, {"w": "prize.", "t": 67.0}, {"w": "Bees", "t": 67.34}, {"w": "love", "t": 67.68}, {"w": "sweet", "t": 68.02}, {"w": "things,", "t": 68.36}, {"w": "so", "t": 68.7}, {"w": "they", "t": 69.04}, {"w": "learned", "t": 69.38}, {"w": "fast.", "t": 69.72}]}, {"start": 70.06, "end": 93.83, "en": "But here is the amazing part. The bees did not just learn by trying again and again. They learned by watching! A \"teacher bee\" showed them how to push the ball, and the student bees copied it. Even cooler, some bees found a shorter, smarter path to the goal than the teacher showed them. They were not just copying — they were thinking!", "title": "蜜蜂踢足球", "cn": "但最神奇的部分在这里。蜜蜂们不只是靠一次次尝试学会的，它们是靠“看”学会的！一只“老师蜜蜂”先示范怎么推球，学生蜜蜂们跟着模仿。更酷的是，有些蜜蜂找到了一条比老师示范的更短、更聪明的进球路线。它们不只是在模仿——它们在思考！", "words": [{"w": "But", "t": 70.06}, {"w": "here", "t": 70.44}, {"w": "is", "t": 70.81}, {"w": "the", "t": 71.19}, {"w": "amazing", "t": 71.57}, {"w": "part.", "t": 71.95}, {"w": "The", "t": 72.32}, {"w": "bees", "t": 72.7}, {"w": "did", "t": 73.08}, {"w": "not", "t": 73.46}, {"w": "just", "t": 73.83}, {"w": "learn", "t": 74.21}, {"w": "by", "t": 74.59}, {"w": "trying", "t": 74.96}, {"w": "again", "t": 75.34}, {"w": "and", "t": 75.72}, {"w": "again.", "t": 76.1}, {"w": "They", "t": 76.47}, {"w": "learned", "t": 76.85}, {"w": "by", "t": 77.23}, {"w": "watching!", "t": 77.61}, {"w": "A", "t": 77.98}, {"w": "\"teacher", "t": 78.36}, {"w": "bee\"", "t": 78.74}, {"w": "showed", "t": 79.12}, {"w": "them", "t": 79.49}, {"w": "how", "t": 79.87}, {"w": "to", "t": 80.25}, {"w": "push", "t": 80.62}, {"w": "the", "t": 81.0}, {"w": "ball,", "t": 81.38}, {"w": "and", "t": 81.76}, {"w": "the", "t": 82.13}, {"w": "student", "t": 82.51}, {"w": "bees", "t": 82.89}, {"w": "copied", "t": 83.27}, {"w": "it.", "t": 83.64}, {"w": "Even", "t": 84.02}, {"w": "cooler,", "t": 84.4}, {"w": "some", "t": 84.77}, {"w": "bees", "t": 85.15}, {"w": "found", "t": 85.53}, {"w": "a", "t": 85.91}, {"w": "shorter,", "t": 86.28}, {"w": "smarter", "t": 86.66}, {"w": "path", "t": 87.04}, {"w": "to", "t": 87.42}, {"w": "the", "t": 87.79}, {"w": "goal", "t": 88.17}, {"w": "than", "t": 88.55}, {"w": "the", "t": 88.93}, {"w": "teacher", "t": 89.3}, {"w": "showed", "t": 89.68}, {"w": "them.", "t": 90.06}, {"w": "They", "t": 90.43}, {"w": "were", "t": 90.81}, {"w": "not", "t": 91.19}, {"w": "just", "t": 91.57}, {"w": "copying", "t": 91.94}, {"w": "—", "t": 92.32}, {"w": "they", "t": 92.7}, {"w": "were", "t": 93.08}, {"w": "thinking!", "t": 93.45}]}, {"start": 93.83, "end": 113.57, "en": "The most surprising moment came later. When the scientists tested the bees the next day, the bees still remembered how to score — they had not forgotten overnight! For a brain smaller than a grain of rice, that is like remembering a whole dance routine after seeing it only once.", "title": "蜜蜂踢足球", "cn": "最惊人的时刻还在后面。第二天科学家再测试这些蜜蜂时，它们居然还记得怎么进球——一夜过去完全没忘！对一颗比米粒还小的大脑来说，这就像只看了一遍就记住了一整套舞蹈动作。", "words": [{"w": "The", "t": 93.83}, {"w": "most", "t": 94.22}, {"w": "surprising", "t": 94.62}, {"w": "moment", "t": 95.01}, {"w": "came", "t": 95.41}, {"w": "later.", "t": 95.8}, {"w": "When", "t": 96.2}, {"w": "the", "t": 96.59}, {"w": "scientists", "t": 96.99}, {"w": "tested", "t": 97.38}, {"w": "the", "t": 97.78}, {"w": "bees", "t": 98.17}, {"w": "the", "t": 98.57}, {"w": "next", "t": 98.96}, {"w": "day,", "t": 99.36}, {"w": "the", "t": 99.75}, {"w": "bees", "t": 100.15}, {"w": "still", "t": 100.54}, {"w": "remembered", "t": 100.94}, {"w": "how", "t": 101.33}, {"w": "to", "t": 101.73}, {"w": "score", "t": 102.12}, {"w": "—", "t": 102.52}, {"w": "they", "t": 102.91}, {"w": "had", "t": 103.31}, {"w": "not", "t": 103.7}, {"w": "forgotten", "t": 104.09}, {"w": "overnight!", "t": 104.49}, {"w": "For", "t": 104.88}, {"w": "a", "t": 105.28}, {"w": "brain", "t": 105.67}, {"w": "smaller", "t": 106.07}, {"w": "than", "t": 106.46}, {"w": "a", "t": 106.86}, {"w": "grain", "t": 107.25}, {"w": "of", "t": 107.65}, {"w": "rice,", "t": 108.04}, {"w": "that", "t": 108.44}, {"w": "is", "t": 108.83}, {"w": "like", "t": 109.23}, {"w": "remembering", "t": 109.62}, {"w": "a", "t": 110.02}, {"w": "whole", "t": 110.41}, {"w": "dance", "t": 110.81}, {"w": "routine", "t": 111.2}, {"w": "after", "t": 111.6}, {"w": "seeing", "t": 111.99}, {"w": "it", "t": 112.39}, {"w": "only", "t": 112.78}, {"w": "once.", "t": 113.18}]}, {"start": 113.57, "end": 124.18, "en": "This little experiment tells us something big: even tiny insect brains can learn new tricks and pass them on. Who knows what else small brains can do?", "title": "蜜蜂踢足球", "cn": "这个小实验告诉我们一个大道理：哪怕小小的昆虫大脑，也能学会新本领，还能传给同伴。谁知道小小的大脑还能做到什么呢？", "words": [{"w": "This", "t": 113.57}, {"w": "little", "t": 113.96}, {"w": "experiment", "t": 114.36}, {"w": "tells", "t": 114.75}, {"w": "us", "t": 115.14}, {"w": "something", "t": 115.53}, {"w": "big:", "t": 115.93}, {"w": "even", "t": 116.32}, {"w": "tiny", "t": 116.71}, {"w": "insect", "t": 117.11}, {"w": "brains", "t": 117.5}, {"w": "can", "t": 117.89}, {"w": "learn", "t": 118.29}, {"w": "new", "t": 118.68}, {"w": "tricks", "t": 119.07}, {"w": "and", "t": 119.46}, {"w": "pass", "t": 119.86}, {"w": "them", "t": 120.25}, {"w": "on.", "t": 120.64}, {"w": "Who", "t": 121.04}, {"w": "knows", "t": 121.43}, {"w": "what", "t": 121.82}, {"w": "else", "t": 122.22}, {"w": "small", "t": 122.61}, {"w": "brains", "t": 123.0}, {"w": "can", "t": 123.39}, {"w": "do?", "t": 123.79}]}, {"start": 135.1, "end": 141.47, "en": "Now let's dive under the sea and meet the octopus — the eight-armed genius of the ocean.", "title": "章鱼做梦", "cn": "现在让我们潜入海底，认识一下章鱼——海洋里的八臂天才。", "words": [{"w": "Now", "t": 135.1}, {"w": "let's", "t": 135.47}, {"w": "dive", "t": 135.85}, {"w": "under", "t": 136.22}, {"w": "the", "t": 136.6}, {"w": "sea", "t": 136.97}, {"w": "and", "t": 137.35}, {"w": "meet", "t": 137.72}, {"w": "the", "t": 138.1}, {"w": "octopus", "t": 138.47}, {"w": "—", "t": 138.85}, {"w": "the", "t": 139.22}, {"w": "eight-armed", "t": 139.6}, {"w": "genius", "t": 139.97}, {"w": "of", "t": 140.35}, {"w": "the", "t": 140.72}, {"w": "ocean.", "t": 141.1}]}, {"start": 141.47, "end": 163.3, "en": "When you sleep, your eyes move quickly — scientists call this dream sleep. Octopuses have something similar! When an octopus falls into deep sleep, its skin starts to flash and change: stripes, spots, waves of color, all dancing across its body. It looks like it is watching a movie behind closed eyes.", "title": "章鱼做梦", "cn": "你睡觉时，眼球会快速转动——科学家把这叫作“梦睡眠”。章鱼也有类似的现象！当章鱼进入深睡，它的皮肤开始闪烁变幻：条纹、斑点、一波波颜色，在它身上跳起舞来。看起来就像它闭着眼睛在看电影。", "words": [{"w": "When", "t": 141.47}, {"w": "you", "t": 141.89}, {"w": "sleep,", "t": 142.31}, {"w": "your", "t": 142.73}, {"w": "eyes", "t": 143.15}, {"w": "move", "t": 143.57}, {"w": "quickly", "t": 143.99}, {"w": "—", "t": 144.41}, {"w": "scientists", "t": 144.83}, {"w": "call", "t": 145.25}, {"w": "this", "t": 145.67}, {"w": "dream", "t": 146.09}, {"w": "sleep.", "t": 146.51}, {"w": "Octopuses", "t": 146.93}, {"w": "have", "t": 147.35}, {"w": "something", "t": 147.77}, {"w": "similar!", "t": 148.19}, {"w": "When", "t": 148.61}, {"w": "an", "t": 149.03}, {"w": "octopus", "t": 149.45}, {"w": "falls", "t": 149.87}, {"w": "into", "t": 150.29}, {"w": "deep", "t": 150.71}, {"w": "sleep,", "t": 151.13}, {"w": "its", "t": 151.55}, {"w": "skin", "t": 151.97}, {"w": "starts", "t": 152.38}, {"w": "to", "t": 152.8}, {"w": "flash", "t": 153.22}, {"w": "and", "t": 153.64}, {"w": "change:", "t": 154.06}, {"w": "stripes,", "t": 154.48}, {"w": "spots,", "t": 154.9}, {"w": "waves", "t": 155.32}, {"w": "of", "t": 155.74}, {"w": "color,", "t": 156.16}, {"w": "all", "t": 156.58}, {"w": "dancing", "t": 157.0}, {"w": "across", "t": 157.42}, {"w": "its", "t": 157.84}, {"w": "body.", "t": 158.26}, {"w": "It", "t": 158.68}, {"w": "looks", "t": 159.1}, {"w": "like", "t": 159.52}, {"w": "it", "t": 159.94}, {"w": "is", "t": 160.36}, {"w": "watching", "t": 160.78}, {"w": "a", "t": 161.2}, {"w": "movie", "t": 161.62}, {"w": "behind", "t": 162.04}, {"w": "closed", "t": 162.46}, {"w": "eyes.", "t": 162.88}]}, {"start": 163.3, "end": 183.98, "en": "Scientists watched sleeping octopuses very carefully and recorded their brain activity too. During these colorful moments, the octopus's brain looks sur e for your hair, and a honeycomb is where bees keep their honey!", "title": "今日笑话", "cn": "今日笑话：为什么蜜蜂的头发黏糊糊的？……因为它们用 honeycomb（蜂巢）！get 到了吗？comb 是梳子，honeycomb 是蜜蜂存蜜的蜂巢！", "words": [{"w": "Here's", "t": 212.11}, {"w": "today's", "t": 212.49}, {"w": "joke:", "t": 212.86}, {"w": "Why", "t": 213.24}, {"w": "do", "t": 213.62}, {"w": "bees", "t": 214.0}, {"w": "have", "t": 214.37}, {"w": "sticky", "t": 214.75}, {"w": "hair?", "t": 215.13}, {"w": "...", "t": 215.5}, {"w": "Because", "t": 215.88}, {"w": "they", "t": 216.26}, {"w": "use", "t": 216.63}, {"w": "honeycombs!", "t": 217.01}, {"w": "Get", "t": 217.39}, {"w": "it?", "t": 217.77}, {"w": "A", "t": 218.14}, {"w": "comb", "t": 218.52}, {"w": "is", "t": 218.9}, {"w": "what", "t": 219.27}, {"w": "you", "t": 219.65}, {"w": "use", "t": 220.03}, {"w": "for", "t": 220.41}, {"w": "your", "t": 220.78}, {"w": "hair,", "t": 221.16}, {"w": "and", "t": 221.54}, {"w": "a", "t": 221.91}, {"w": "honeycomb", "t": 222.29}, {"w": "is", "t": 222.67}, {"w": "where", "t": 223.04}, {"w": "bees", "t": 223.42}, {"w": "keep", "t": 223.8}, {"w": "their", "t": 224.18}, {"w": "honey!", "t": 224.55}]}, {"start": 234.53, "end": 246.46, "en": "That brings us to the end of today's show! Before you go, here's a question: If you could teach any animal to play any sport, which animal and which sport would you choose — and why?", "title": "结束语与互动问题", "cn": "今天的节目就到这里！走之前留一个问题：如果你能教会任何一种动物玩任何一种运动，你会选什么动物、什么运动？为什么？", "words": [{"w": "That", "t": 234.53}, {"w": "brings", "t": 234.86}, {"w": "us", "t": 235.19}, {"w": "to", "t": 235.52}, {"w": "the", "t": 235.86}, {"w": "end", "t": 236.19}, {"w": "of", "t": 236.52}, {"w": "today's", "t": 236.85}, {"w": "show!", "t": 237.18}, {"w": "Before", "t": 237.51}, {"w": "you", "t": 237.84}, {"w": "go,", "t": 238.18}, {"w": "here's", "t": 238.51}, {"w": "a", "t": 238.84}, {"w": "question:", "t": 239.17}, {"w": "If", "t": 239.5}, {"w": "you", "t": 239.83}, {"w": "could", "t": 240.16}, {"w": "teach", "t": 240.5}, {"w": "any", "t": 240.83}, {"w": "animal", "t": 241.16}, {"w": "to", "t": 241.49}, {"w": "play", "t": 241.82}, {"w": "any", "t": 242.15}, {"w": "sport,", "t": 242.48}, {"w": "which", "t": 242.81}, {"w": "animal", "t": 243.15}, {"w": "and", "t": 243.48}, {"w": "which", "t": 243.81}, {"w": "sport", "t": 244.14}, {"w": "would", "t": 244.47}, {"w": "you", "t": 244.8}, {"w": "choose", "t": 245.13}, {"w": "—", "t": 245.47}, {"w": "and", "t": 245.8}, {"w": "why?", "t": 246.13}]}, {"start": 260.38, "end": 263.31, "en": "Have a wonderful day, and see you tomorrow morning!", "title": "告别", "cn": "祝你有美好的一天，明天早上见！", "words": [{"w": "Have", "t": 260.38}, {"w": "a", "t": 260.71}, {"w": "wonderful", "t": 261.03}, {"w": "day,", "t": 261.36}, {"w": "and", "t": 261.68}, {"w": "see", "t": 262.01}, {"w": "you", "t": 262.33}, {"w": "tomorrow", "t": 262.66}, {"w": "morning!", "t": 262.98}]}];
const CURSOR_LEAD = 0.9;
const audio = document.getElementById('audio');
const epVideo = document.getElementById('epVideo');
if (epVideo) {
  epVideo.addEventListener('play', () => { if (!audio.paused) audio.pause(); });
  audio.addEventListener('play', () => { if (!epVideo.paused) epVideo.pause(); });
}
const playBtn = document.getElementById('playBtn');
const progress = document.getElementById('progress');
const curEl = document.getElementById('cur');
const durEl = document.getElementById('dur');
const blocksEl = document.getElementById('blocks');
let rafId = null, seeking = false, blobReady = false;

// Load audio as blob for reliable seeking on Chromium
fetch('audio_v5.mp3').then(r => r.blob()).then(blob => {
  audio.src = URL.createObjectURL(blob);
  blobReady = true;
});

// Render blocks
BLOCKS.forEach((b, i) => {
  const div = document.createElement('div');
  div.className = 'block'; div.dataset.idx = i;
  const words = b.words.map((w, wi) => `<span class="w" data-wi="${wi}">${escHtml(w.w)}</span>`).join(' ');
  div.innerHTML = `<div class="sec-title">${escHtml(b.title)}</div><div class="en">${words}</div><div class="cn">${escHtml(b.cn)}</div>`;
  div.addEventListener('click', () => {
    const t = audio.currentTime;
    if (t >= b.start && t < b.end) {
      if (audio.paused) audio.play(); else audio.pause();
    } else {
      seekTo(b.start + 0.03, true);
    }
  });
  blocksEl.appendChild(div);
});
function escHtml(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

function fmt(t) { t = Math.max(0, Math.floor(t)); return Math.floor(t/60) + ':' + String(t%60).padStart(2, '0'); }

function seekTo(time, autoplay) {
  if (!blobReady) return;
  seeking = true;
  const doSeek = () => {
    audio.currentTime = time;
  };
  const onSeeked = () => {
    audio.removeEventListener('seeked', onSeeked);
    seeking = false;
    if (autoplay && audio.paused) audio.play();
    updateHighlight();
  };
  audio.addEventListener('seeked', onSeeked);
  doSeek();
  setTimeout(() => { audio.removeEventListener('seeked', onSeeked); seeking = false; if (autoplay && audio.paused) audio.play(); }, 800);
}

playBtn.addEventListener('click', () => {
  if (audio.paused) audio.play(); else audio.pause();
});
audio.addEventListener('play', () => { playBtn.textContent = '⏸'; startRaf(); });
audio.addEventListener('pause', () => { playBtn.textContent = '▶'; });
audio.addEventListener('loadedmetadata', () => { durEl.textContent = fmt(audio.duration); });
audio.addEventListener('timeupdate', () => {
  if (!seeking) progress.value = (audio.currentTime / audio.duration) * 100;
  curEl.textContent = fmt(audio.currentTime);
});
progress.addEventListener('input', () => {
  if (!audio.duration) return;
  seeking = true;
  seekTo((progress.value / 100) * audio.duration, !audio.paused);
});
progress.addEventListener('change', () => { seeking = false; });

document.querySelectorAll('.speeds button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.speeds button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    audio.playbackRate = parseFloat(btn.dataset.r);
  });
});

let curBlock = -1;
function updateHighlight() {
  const t = audio.currentTime + CURSOR_LEAD;
  let bi = -1;
  for (let i = 0; i < BLOCKS.length; i++) {
    if (t >= BLOCKS[i].start && t < BLOCKS[i].end) { bi = i; break; }
  }
  document.querySelectorAll('.block').forEach((el, i) => {
    el.classList.toggle('active', i === bi);
  });
  document.querySelectorAll('.en .w.hl').forEach(el => el.classList.remove('hl'));
  if (bi >= 0) {
    const b = BLOCKS[bi];
    const blockEl = document.querySelectorAll('.block')[bi];
    let wi = -1;
    for (let j = 0; j < b.words.length; j++) {
      if (t >= b.words[j].t) wi = j; else break;
    }
    if (wi >= 0) {
      const wEl = blockEl.querySelectorAll('.w')[wi];
      if (wEl) wEl.classList.add('hl');
    }
    if (bi !== curBlock) {
      curBlock = bi;
      blockEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
  }
}
function startRaf() {
  cancelAnimationFrame(rafId);
  const loop = () => { if (!audio.paused) updateHighlight(); rafId = requestAnimationFrame(loop); };
  loop();
}
</script>
