const BLOCKS = [{"start": 18.27, "end": 29.43, "en": "Welcome back to Michael's Morning Listening! Today we have two tiny geniuses for you: a bee that learned to play soccer, and an octopus that might be dreaming in color. Let's jump in!", "title": "开场白", "cn": "欢迎回到 Michael 的早听晚读！今天有两个小天才要介绍给你：一只学会了踢足球的蜜蜂，和一只可能会做彩色梦的章鱼。让我们开始吧！", "words": [{"w": "Welcome", "t": 18.27}, {"w": "back", "t": 18.61}, {"w": "to", "t": 18.95}, {"w": "Michael's", "t": 19.28}, {"w": "Morning", "t": 19.62}, {"w": "Listening!", "t": 19.96}, {"w": "Today", "t": 20.3}, {"w": "we", "t": 20.64}, {"w": "have", "t": 20.98}, {"w": "two", "t": 21.31}, {"w": "tiny", "t": 21.65}, {"w": "geniuses", "t": 21.99}, {"w": "for", "t": 22.33}, {"w": "you:", "t": 22.67}, {"w": "a", "t": 23.0}, {"w": "bee", "t": 23.34}, {"w": "that", "t": 23.68}, {"w": "learned", "t": 24.02}, {"w": "to", "t": 24.36}, {"w": "play", "t": 24.7}, {"w": "soccer,", "t": 25.03}, {"w": "and", "t": 25.37}, {"w": "an", "t": 25.71}, {"w": "octopus", "t": 26.05}, {"w": "that", "t": 26.39}, {"w": "might", "t": 26.72}, {"w": "be", "t": 27.06}, {"w": "dreaming", "t": 27.4}, {"w": "in", "t": 27.74}, {"w": "color.", "t": 28.08}, {"w": "Let's", "t": 28.42}, {"w": "jump", "t": 28.75}, {"w": "in!", "t": 29.09}]}, {"start": 40.13, "end": 50.72, "en": "Can you imagine a bee playing soccer? Scientists did more than imagine — they actually trained bumblebees to push a tiny ball into a tiny goal!", "title": "蜜蜂踢足球", "cn": "你能想象蜜蜂踢足球吗？科学家不只停留在想象——他们真的训练大黄蜂把一颗小球推进小球门！", "words": [{"w": "Can", "t": 40.13}, {"w": "you", "t": 40.54}, {"w": "imagine", "t": 40.94}, {"w": "a", "t": 41.35}, {"w": "bee", "t": 41.76}, {"w": "playing", "t": 42.17}, {"w": "soccer?", "t": 42.57}, {"w": "Scientists", "t": 42.98}, {"w": "did", "t": 43.39}, {"w": "more", "t": 43.8}, {"w": "than", "t": 44.2}, {"w": "imagine", "t": 44.61}, {"w": "—", "t": 45.02}, {"w": "they", "t": 45.42}, {"w": "actually", "t": 45.83}, {"w": "trained", "t": 46.24}, {"w": "bumblebees", "t": 46.65}, {"w": "to", "t": 47.05}, {"w": "push", "t": 47.46}, {"w": "a", "t": 47.87}, {"w": "tiny", "t": 48.28}, {"w": "ball", "t": 48.68}, {"w": "into", "t": 49.09}, {"w": "a", "t": 49.5}, {"w": "tiny", "t": 49.91}, {"w": "goal!", "t": 50.31}]}, {"start": 50.72, "end": 66.8, "en": "Here is how it worked. The scientists built a mini soccer field with a little ball and a small goal. When a bee pushed the ball into the goal — GOAL! — it got a sweet drink of sugar water as a prize. Bees love sweet things, so they learned fast.", "title": "蜜蜂踢足球", "cn": "过程是这样的。科学家们搭建了一个迷你足球场，放了一颗小球和一个小球门。当蜜蜂把球推进球门——进球！——它就能喝到一杯甜甜的糖水作为奖励。蜜蜂最爱甜食，所以它们学得飞快。", "words": [{"w": "Here", "t": 50.72}, {"w": "is", "t": 51.04}, {"w": "how", "t": 51.35}, {"w": "it", "t": 51.67}, {"w": "worked.", "t": 51.98}, {"w": "The", "t": 52.3}, {"w": "scientists", "t": 52.61}, {"w": "built", "t": 52.93}, {"w": "a", "t": 53.24}, {"w": "mini", "t": 53.56}, {"w": "soccer", "t": 53.87}, {"w": "field", "t": 54.19}, {"w": "with", "t": 54.5}, {"w": "a", "t": 54.82}, {"w": "little", "t": 55.13}, {"w": "ball", "t": 55.45}, {"w": "and", "t": 55.76}, {"w": "a", "t": 56.08}, {"w": "small", "t": 56.4}, {"w": "goal.", "t": 56.71}, {"w": "When", "t": 57.03}, {"w": "a", "t": 57.34}, {"w": "bee", "t": 57.66}, {"w": "pushed", "t": 57.97}, {"w": "the", "t": 58.29}, {"w": "ball", "t": 58.6}, {"w": "into", "t": 58.92}, {"w": "the", "t": 59.23}, {"w": "goal", "t": 59.55}, {"w": "—", "t": 59.86}, {"w": "GOAL!", "t": 60.18}, {"w": "—", "t": 60.49}, {"w": "it", "t": 60.81}, {"w": "got", "t": 61.12}, {"w": "a", "t": 61.44}, {"w": "sweet", "t": 61.76}, {"w": "drink", "t": 62.07}, {"w": "of", "t": 62.39}, {"w": "sugar", "t": 62.7}, {"w": "water", "t": 63.02}, {"w": "as", "t": 63.33}, {"w": "a", "t": 63.65}, {"w": "prize.", "t": 63.96}, {"w": "Bees", "t": 64.28}, {"w": "love", "t": 64.59}, {"w": "sweet", "t": 64.91}, {"w": "things,", "t": 65.22}, {"w": "so", "t": 65.54}, {"w": "they", "t": 65.85}, {"w": "learned", "t": 66.17}, {"w": "fast.", "t": 66.48}]}, {"start": 66.8, "end": 88.86, "en": "But here is the amazing part. The bees did not just learn by trying again and again. They learned by watching! A \"teacher bee\" showed them how to push the ball, and the student bees copied it. Even cooler, some bees found a shorter, smarter path to the goal than the teacher showed them. They were not just copying — they were thinking!", "title": "蜜蜂踢足球", "cn": "但最神奇的部分在这里。蜜蜂们不只是靠一次次尝试学会的，它们是靠“看”学会的！一只“老师蜜蜂”先示范怎么推球，学生蜜蜂们跟着模仿。更酷的是，有些蜜蜂找到了一条比老师示范的更短、更聪明的进球路线。它们不只是在模仿——它们在思考！", "words": [{"w": "But", "t": 66.8}, {"w": "here", "t": 67.15}, {"w": "is", "t": 67.5}, {"w": "the", "t": 67.85}, {"w": "amazing", "t": 68.2}, {"w": "part.", "t": 68.55}, {"w": "The", "t": 68.9}, {"w": "bees", "t": 69.25}, {"w": "did", "t": 69.6}, {"w": "not", "t": 69.95}, {"w": "just", "t": 70.3}, {"w": "learn", "t": 70.65}, {"w": "by", "t": 71.0}, {"w": "trying", "t": 71.35}, {"w": "again", "t": 71.7}, {"w": "and", "t": 72.05}, {"w": "again.", "t": 72.4}, {"w": "They", "t": 72.75}, {"w": "learned", "t": 73.1}, {"w": "by", "t": 73.45}, {"w": "watching!", "t": 73.8}, {"w": "A", "t": 74.15}, {"w": "\"teacher", "t": 74.5}, {"w": "bee\"", "t": 74.85}, {"w": "showed", "t": 75.2}, {"w": "them", "t": 75.55}, {"w": "how", "t": 75.9}, {"w": "to", "t": 76.25}, {"w": "push", "t": 76.6}, {"w": "the", "t": 76.95}, {"w": "ball,", "t": 77.3}, {"w": "and", "t": 77.65}, {"w": "the", "t": 78.01}, {"w": "student", "t": 78.36}, {"w": "bees", "t": 78.71}, {"w": "copied", "t": 79.06}, {"w": "it.", "t": 79.41}, {"w": "Even", "t": 79.76}, {"w": "cooler,", "t": 80.11}, {"w": "some", "t": 80.46}, {"w": "bees", "t": 80.81}, {"w": "found", "t": 81.16}, {"w": "a", "t": 81.51}, {"w": "shorter,", "t": 81.86}, {"w": "smarter", "t": 82.21}, {"w": "path", "t": 82.56}, {"w": "to", "t": 82.91}, {"w": "the", "t": 83.26}, {"w": "goal", "t": 83.61}, {"w": "than", "t": 83.96}, {"w": "the", "t": 84.31}, {"w": "teacher", "t": 84.66}, {"w": "showed", "t": 85.01}, {"w": "them.", "t": 85.36}, {"w": "They", "t": 85.71}, {"w": "were", "t": 86.06}, {"w": "not", "t": 86.41}, {"w": "just", "t": 86.76}, {"w": "copying", "t": 87.11}, {"w": "—", "t": 87.46}, {"w": "they", "t": 87.81}, {"w": "were", "t": 88.16}, {"w": "thinking!", "t": 88.51}]}, {"start": 88.86, "end": 107.18, "en": "The most surprising moment came later. When the scientists tested the bees the next day, the bees still remembered how to score — they had not forgotten overnight! For a brain smaller than a grain of rice, that is like remembering a whole dance routine after seeing it only once.", "title": "蜜蜂踢足球", "cn": "最惊人的时刻还在后面。第二天科学家再测试这些蜜蜂时，它们居然还记得怎么进球——一夜过去完全没忘！对一颗比米粒还小的大脑来说，这就像只看了一遍就记住了一整套舞蹈动作。", "words": [{"w": "The", "t": 88.86}, {"w": "most", "t": 89.23}, {"w": "surprising", "t": 89.59}, {"w": "moment", "t": 89.96}, {"w": "came", "t": 90.33}, {"w": "later.", "t": 90.69}, {"w": "When", "t": 91.06}, {"w": "the", "t": 91.42}, {"w": "scientists", "t": 91.79}, {"w": "tested", "t": 92.16}, {"w": "the", "t": 92.52}, {"w": "bees", "t": 92.89}, {"w": "the", "t": 93.26}, {"w": "next", "t": 93.62}, {"w": "day,", "t": 93.99}, {"w": "the", "t": 94.36}, {"w": "bees", "t": 94.72}, {"w": "still", "t": 95.09}, {"w": "remembered", "t": 95.46}, {"w": "how", "t": 95.82}, {"w": "to", "t": 96.19}, {"w": "score", "t": 96.55}, {"w": "—", "t": 96.92}, {"w": "they", "t": 97.29}, {"w": "had", "t": 97.65}, {"w": "not", "t": 98.02}, {"w": "forgotten", "t": 98.39}, {"w": "overnight!", "t": 98.75}, {"w": "For", "t": 99.12}, {"w": "a", "t": 99.49}, {"w": "brain", "t": 99.85}, {"w": "smaller", "t": 100.22}, {"w": "than", "t": 100.58}, {"w": "a", "t": 100.95}, {"w": "grain", "t": 101.32}, {"w": "of", "t": 101.68}, {"w": "rice,", "t": 102.05}, {"w": "that", "t": 102.42}, {"w": "is", "t": 102.78}, {"w": "like", "t": 103.15}, {"w": "remembering", "t": 103.52}, {"w": "a", "t": 103.88}, {"w": "whole", "t": 104.25}, {"w": "dance", "t": 104.62}, {"w": "routine", "t": 104.98}, {"w": "after", "t": 105.35}, {"w": "seeing", "t": 105.71}, {"w": "it", "t": 106.08}, {"w": "only", "t": 106.45}, {"w": "once.", "t": 106.81}]}, {"start": 107.18, "end": 117.03, "en": "This little experiment tells us something big: even tiny insect brains can learn new tricks and pass them on. Who knows what else small brains can do?", "title": "蜜蜂踢足球", "cn": "这个小实验告诉我们一个大道理：哪怕小小的昆虫大脑，也能学会新本领，还能传给同伴。谁知道小小的大脑还能做到什么呢？", "words": [{"w": "This", "t": 107.18}, {"w": "little", "t": 107.54}, {"w": "experiment", "t": 107.91}, {"w": "tells", "t": 108.27}, {"w": "us", "t": 108.64}, {"w": "something", "t": 109.0}, {"w": "big:", "t": 109.37}, {"w": "even", "t": 109.73}, {"w": "tiny", "t": 110.1}, {"w": "insect", "t": 110.46}, {"w": "brains", "t": 110.83}, {"w": "can", "t": 111.19}, {"w": "learn", "t": 111.56}, {"w": "new", "t": 111.92}, {"w": "tricks", "t": 112.29}, {"w": "and", "t": 112.65}, {"w": "pass", "t": 113.02}, {"w": "them", "t": 113.38}, {"w": "on.", "t": 113.75}, {"w": "Who", "t": 114.11}, {"w": "knows", "t": 114.48}, {"w": "what", "t": 114.84}, {"w": "else", "t": 115.21}, {"w": "small", "t": 115.57}, {"w": "brains", "t": 115.94}, {"w": "can", "t": 116.3}, {"w": "do?", "t": 116.67}]}, {"start": 128.05, "end": 133.88, "en": "Now let's dive under the sea and meet the octopus — the eight-armed genius of the ocean.", "title": "章鱼做梦", "cn": "现在让我们潜入海底，认识一下章鱼——海洋里的八臂天才。", "words": [{"w": "Now", "t": 128.05}, {"w": "let's", "t": 128.39}, {"w": "dive", "t": 128.74}, {"w": "under", "t": 129.08}, {"w": "the", "t": 129.42}, {"w": "sea", "t": 129.76}, {"w": "and", "t": 130.11}, {"w": "meet", "t": 130.45}, {"w": "the", "t": 130.79}, {"w": "octopus", "t": 131.14}, {"w": "—", "t": 131.48}, {"w": "the", "t": 131.82}, {"w": "eight-armed", "t": 132.17}, {"w": "genius", "t": 132.51}, {"w": "of", "t": 132.85}, {"w": "the", "t": 133.19}, {"w": "ocean.", "t": 133.54}]}, {"start": 133.88, "end": 153.88, "en": "When you sleep, your eyes move quickly — scientists call this dream sleep. Octopuses have something similar! When an octopus falls into deep s const CURSOR_LEAD = 0.9;
const audio = document.getElementById('audio');
const playBtn = document.getElementById('playBtn');
const progress = document.getElementById('progress');
const curEl = document.getElementById('cur');
const durEl = document.getElementById('dur');
const blocksEl = document.getElementById('blocks');
let rafId = null, seeking = false, blobReady = false;

// Load audio as blob for reliable seeking on Chromium
fetch('audio_v4.mp3').then(r => r.blob()).then(blob => {
  audio.src = URL.createObjectURL(blob);
  blobReady = true;
});

// Render blocks
BLOCKS.forEach((b, i) => {
  const div = document.createElement('div');
  div.className = 'block'; div.dataset.idx = i;
  const words = b.words.map((w, wi) => `<span class="w" data-wi="${wi}">${escHtml(w.w)}</span>`).join(' ');
  div.innerHTML = `<div class="sec-title">${escHtml(b.title)}</div><div class="en">${words}</div><div class="cn">${escHtml(b.cn)}</div>`;
  div.addEventListener('click', () => {
    const t = audio.currentTime;
    if (t >= b.start && t < b.end) {
      if (audio.paused) audio.play(); else audio.pause();
    } else {
      seekTo(b.start + 0.03, true);
    }
  });
  blocksEl.appendChild(div);
});
function escHtml(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

function fmt(t) { t = Math.max(0, Math.floor(t)); return Math.floor(t/60) + ':' + String(t%60).padStart(2, '0'); }

function seekTo(time, autoplay) {
  if (!blobReady) return;
  seeking = true;
  const doSeek = () => {
    audio.currentTime = time;
  };
  const onSeeked = () => {
    audio.removeEventListener('seeked', onSeeked);
    seeking = false;
    if (autoplay && audio.paused) audio.play();
    updateHighlight();
  };
  audio.addEventListener('seeked', onSeeked);
  doSeek();
  setTimeout(() => { audio.removeEventListener('seeked', onSeeked); seeking = false; if (autoplay && audio.paused) audio.play(); }, 800);
}

playBtn.addEventListener('click', () => {
  if (audio.paused) audio.play(); else audio.pause();
});
audio.addEventListener('play', () => { playBtn.textContent = '⏸'; startRaf(); });
audio.addEventListener('pause', () => { playBtn.textContent = '▶'; });
audio.addEventListener('loadedmetadata', () => { durEl.textContent = fmt(audio.duration); });
audio.addEventListener('timeupdate', () => {
  if (!seeking) progress.value = (audio.currentTime / audio.duration) * 100;
  curEl.textContent = fmt(audio.currentTime);
});
progress.addEventListener('input', () => {
  if (!audio.duration) return;
  seeking = true;
  seekTo((progress.value / 100) * audio.duration, !audio.paused);
});
progress.addEventListener('change', () => { seeking = false; });

document.querySelectorAll('.speeds button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.speeds button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    audio.playbackRate = parseFloat(btn.dataset.r);
  });
});

let curBlock = -1;
function updateHighlight() {
  const t = audio.currentTime + CURSOR_LEAD;
  let bi = -1;
  for (let i = 0; i < BLOCKS.length; i++) {
    if (t >= BLOCKS[i].start && t < BLOCKS[i].end) { bi = i; break; }
  }
  document.querySelectorAll('.block').forEach((el, i) => {
    el.classList.toggle('active', i === bi);
  });
  document.querySelectorAll('.en .w.hl').forEach(el => el.classList.remove('hl'));
  if (bi >= 0) {
    const b = BLOCKS[bi];
    const blockEl = document.querySelectorAll('.block')[bi];
    let wi = -1;
    for (let j = 0; j < b.words.length; j++) {
      if (t >= b.words[j].t) wi = j; else break;
    }
    if (wi >= 0) {
      const wEl = blockEl.querySelectorAll('.w')[wi];
      if (wEl) wEl.classList.add('hl');
    }
    if (bi !== curBlock) {
      curBlock = bi;
      blockEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
  }
}
function startRaf() {
  cancelAnimationFrame(rafId);
  const loop = () => { if (!audio.paused) updateHighlight(); rafId = requestAnimationFrame(loop); };
  loop();
}
</script>
