pened", "t": 51.48}, {"w": "in", "t": 51.86}, {"w": "real", "t": 52.25}, {"w": "life!", "t": 52.63}]}, {"start": 53.01, "end": 82.86, "en": "Engineers showed off a new electric sports car with ten small thrusters built into its body. These thrusters shoot out powerful bursts of compressed air — just like the ones on a spaceship. During a live show, the car drove up a huge curved ramp, kept driving while upside down, then flew into the air, did a complete barrel roll, and landed safely on its wheels. It even lifted itself over five other cars while moving!", "title": "会飞的汽车", "cn": "工程师们展示了一辆全新的电动跑车，车身里装着十个小型推进器。这些推进器喷出强劲的压缩空气——就像宇宙飞船上的一样。在一场现场演示中，这辆车开上了一个巨大的弧形坡道，倒挂着继续行驶，然后腾空而起，在空中完成了一个完整的横滚翻转，最后稳稳地用轮子着陆。它甚至在行驶中从另外五辆车的头顶上\"飞\"了过去！", "words": [{"w": "Engineers", "t": 53.01}, {"w": "showed", "t": 53.4}, {"w": "off", "t": 53.8}, {"w": "a", "t": 54.19}, {"w": "new", "t": 54.58}, {"w": "electric", "t": 54.97}, {"w": "sports", "t": 55.37}, {"w": "car", "t": 55.76}, {"w": "with", "t": 56.15}, {"w": "ten", "t": 56.54}, {"w": "small", "t": 56.94}, {"w": "thrusters", "t": 57.33}, {"w": "built", "t": 57.72}, {"w": "into", "t": 58.12}, {"w": "its", "t": 58.51}, {"w": "body.", "t": 58.9}, {"w": "These", "t": 59.29}, {"w": "thrusters", "t": 59.69}, {"w": "shoot", "t": 60.08}, {"w": "out", "t": 60.47}, {"w": "powerful", "t": 60.87}, {"w": "bursts", "t": 61.26}, {"w": "of", "t": 61.65}, {"w": "compressed", "t": 62.04}, {"w": "air", "t": 62.44}, {"w": "—", "t": 62.83}, {"w": "just", "t": 63.22}, {"w": "like", "t": 63.61}, {"w": "the", "t": 64.01}, {"w": "ones", "t": 64.4}, {"w": "on", "t": 64.79}, {"w": "a", "t": 65.19}, {"w": "spaceship.", "t": 65.58}, {"w": "During", "t": 65.97}, {"w": "a", "t": 66.36}, {"w": "live", "t": 66.76}, {"w": "show,", "t": 67.15}, {"w": "the", "t": 67.54}, {"w": "car", "t": 67.94}, {"w": "drove", "t": 68.33}, {"w": "up", "t": 68.72}, {"w": "a", "t": 69.11}, {"w": "huge", "t": 69.51}, {"w": "curved", "t": 69.9}, {"w": "ramp,", "t": 70.29}, {"w": "kept", "t .41}, {"w": "three", "t": 93.77}, {"w": "hundred", "t": 94.14}, {"w": "miles", "t": 94.5}, {"w": "on", "t": 94.87}, {"w": "one", "t": 95.23}, {"w": "charge,", "t": 95.59}, {"w": "just", "t": 95.96}, {"w": "like", "t": 96.32}, {"w": "a", "t": 96.68}, {"w": "normal", "t": 97.05}, {"w": "electric", "t": 97.41}, {"w": "car.", "t": 97.78}]}, {"start": 98.14, "end": 120.74, "en": "How does it work? The secret is simple physics. When the thrusters push air down, the air pushes the car up. It is the same idea that lifts a rocket off the ground. The car also has strong fans underneath that suck air out, pressing the car tightly onto the road — that is how it can drive upside down without falling!", "title": "会飞的汽车", "cn": "它是怎么做到的？秘密就是简单的物理学：当推进器把空气往下推，空气就把车往上托。这和把火箭送上天的原理一模一样。车底还装着强力风扇，把空气抽走，把车紧紧\"按\"在路面上——这就是它能倒挂行驶而不掉下来的原因！", "words": [{"w": "How", "t": 98.14}, {"w": "does", "t": 98.5}, {"w": "it", "t": 98.87}, {"w": "work?", "t": 99.23}, {"w": "The", "t": 99.6}, {"w": "secret", "t": 99.96}, {"w": "is", "t": 100.33}, {"w": "simple", "t": 100.69}, {"w": "physics.", "t": 101.06}, {"w": "When", "t": 101.42}, {"w": "the", "t": 101.79}, {"w": "thrusters", "t": 102.15}, {"w": "push", "t": 102.51}, {"w": "air", "t": 102.88}, {"w": "down,", "t": 103.24}, {"w": "the", "t": 103.61}, {"w": "air", "t": 103.97}, {"w": "pushes", "t": 104.34}, {"w": "the", "t": 104.7}, {"w": "car", "t": 105.07}, {"w": "up.", "t": 105.43}, {"w": "It", "t": 105.79}, {"w": "is", "t": 106.16}, {"w": "the", "t": 106.52}, {"w": "same", "t": 106.89}, {"w": "idea", "t": 107.25}, {"w": "that", "t": 107.62}, {"w": "lifts", "t": 107.98}, {"w": "a", "t": 108.35}, {"w": "rocket", "t": 108.71}, {"w": "off", "t": 109.08}, {"w": "the", "t": 109.44}, {"w": "ground.", "t": 109.8}, {"w": "The", "t": 110.17}, {"w": "car", "t": 110.53}, {"w": "also", "t": 110.9}, {"w": "has", "t": 111.26}, {"w": "strong", "t": 111.63}, {"w": "fans", "t": 111.99}, {"w": "underneath", "t": 112.36}, {"w": "that", "t": 112.72}, {"w": "suck", "t" "words": [{"w": "Have", "t": 288.57}, {"w": "a", "t": 288.87}, {"w": "wonderful", "t": 289.18}, {"w": "day,", "t": 289.48}, {"w": "and", "t": 289.79}, {"w": "see", "t": 290.09}, {"w": "you", "t": 290.4}, {"w": "tomorrow", "t": 290.7}, {"w": "morning!", "t": 291.01}]}];
const CURSOR_LEAD = 0.9;
const audio = document.getElementById('audio');
const epVideo = document.getElementById('epVideo');
if (epVideo) {
  epVideo.addEventListener('play', () => { if (!audio.paused) audio.pause(); });
  audio.addEventListener('play', () => { if (!epVideo.paused) epVideo.pause(); });
}
const playBtn = document.getElementById('playBtn');
const progress = document.getElementById('progress');
const curEl = document.getElementById('cur');
const durEl = document.getElementById('dur');
const blocksEl = document.getElementById('blocks');
let rafId = null, seeking = false, blobReady = false;

// Load audio as blob for reliable seeking on Chromium
fetch('audio_v7.mp3').then(r => r.blob()).then(blob => {
  audio.src = URL.createObjectURL(blob);
  blobReady = true;
});

// Render blocks
BLOCKS.forEach((b, i) => {
  const div = document.createElement('div');
  div.className = 'block'; div.dataset.idx = i;
  const words = b.words.map((w, wi) => `<span class="w" data-wi="${wi}">${escHtml(w.w)}</span>`).join(' ');
  div.innerHTML = `<div class="sec-title">${escHtml(b.title)}</div><div class="en">${words}</div><div class="cn">${escHtml(b.cn)}</div>`;
  div.addEventListener('click', () => {
    const t = audio.currentTime;
    if (t >= b.start && t < b.end) {
      if (audio.paused) audio.play(); else audio.pause();
    } else {
      seekTo(b.start + 0.03, true);
    }
  });
  blocksEl.appendChild(div);
});
function escHtml(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

function fmt(t) { t = Math.max(0, Math.floor(t)); return Math.floor(t/60) + ':' + String(t%60).padStart(2, '0'); }

function seekTo(time, autoplay) {
  if (!blobReady) return;
  seeking = true;
  const doSeek = () => {
    audio.currentTime = time;
  };
  const onSeeked = () => {
    audio.removeEventListener('seeked', onSeeked);
    seeking = false;
    if (autoplay && audio.paused) audio.play();
    updateHighlight();
  };
  audio.addEventListener('seeked', onSeeked);
  doSeek();
  setTimeout(() => { audio.removeEventListener('seeked', onSeeked); seeking = false; if (autoplay && audio.paused) audio.play(); }, 800);
}

playBtn.addEventListener('click', () => {
  if (audio.paused) audio.play(); else audio.pause();
});
audio.addEventListener('play', () => { playBtn.textContent = '⏸'; startRaf(); });
audio.addEventListener('pause', () => { playBtn.textContent = '▶'; });
audio.addEventListener('loadedmetadata', () => { durEl.textContent = fmt(audio.duration); });
audio.addEventListener('timeupdate', () => {
  if (!seeking) progress.value = (audio.currentTime / audio.duration) * 100;
  curEl.textContent = fmt(audio.currentTime);
});
progress.addEventListener('input', () => {
  if (!audio.duration) return;
  seeking = true;
  seekTo((progress.value / 100) * audio.duration, !audio.paused);
});
progress.addEventListener('change', () => { seeking = false; });

document.querySelectorAll('.speeds button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.speeds button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    audio.playbackRate = parseFloat(btn.dataset.r);
  });
});

let curBlock = -1;
function updateHighlight() {
  const t = audio.currentTime + CURSOR_LEAD;
  let bi = -1;
  for (let i = 0; i < BLOCKS.length; i++) {
    if (t >= BLOCKS[i].start && t < BLOCKS[i].end) { bi = i; break; }
  }
  document.querySelectorAll('.block').forEach((el, i) => {
    el.classList.toggle('active', i === bi);
  });
  document.querySelectorAll('.en .w.hl').forEach(el => el.classList.remove('hl'));
  if (bi >= 0) {
    const b = BLOCKS[bi];
    const blockEl = document.querySelectorAll('.block')[bi];
    let wi = -1;
    for (let j = 0; j < b.words.length; j++) {
      if (t >= b.words[j].t) wi = j; else break;
    }
    if (wi >= 0) {
      const wEl = blockEl.querySelectorAll('.w')[wi];
      if (wEl) wEl.classList.add('hl');
    }
    if (bi !== curBlock) {
      curBlock = bi;
      blockEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
  }
}
function startRaf() {
  cancelAnimationFrame(rafId);
  const loop = () => { if (!audio.paused) updateHighlight(); rafId = requestAnimationFrame(loop); };
  loop();
}
</script>
